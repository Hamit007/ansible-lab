---
- name: Install and configure Nginx and PHP
  hosts: web
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Nginx and PHP
      apt:
        name:
          - nginx
          - php-fpm
        state: present

    - name: Ensure Nginx is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes
